[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "backtesting"
description = "Backtest trading strategies in Python"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Zach Lûster" }]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "numpy >= 1.17.0",
    "pandas >= 0.25.0, != 0.25.0",
    "bokeh >= 3.0.0, != 3.0.*, != 3.2.*",
]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = [
    "algo", "algorithmic", "ashi", "backtest", "backtesting", "bitcoin",
    "bokeh", "bonds", "candle", "candlestick", "cboe", "chart", "cme",
    "commodities", "crash", "crypto", "currency", "doji", "drawdown",
    "equity", "etf", "ethereum", "exchange", "finance", "financial",
    "forecast", "forex", "fund", "futures", "fx", "fxpro", "gold", "heiken",
    "historical", "indicator", "invest", "investing", "investment", "macd",
    "market", "mechanical", "money", "oanda", "ohlc", "ohlcv", "order",
    "price", "profit", "quant", "quantitative", "rsi", "silver",
    "simulation", "stocks", "strategy", "ticker", "trader", "trading",
    "tradingview", "usd",
]

[project.urls]
Homepage = "https://kernc.github.io/backtesting.py/"
Documentation = "https://kernc.github.io/backtesting.py/doc/backtesting/"
Source = "https://github.com/kernc/backtesting.py/"
Tracker = "https://github.com/kernc/backtesting.py/issues"

[project.optional-dependencies]
doc = [
    "pdoc3",
    "jupytext >= 1.3",
    "nbconvert",
    "ipykernel",       # for nbconvert
    "jupyter_client",  # for nbconvert
]
test = [
    "matplotlib",
    "scikit-learn",
    "sambo",
    "tqdm",
    "ipywidgets",  # for tqdm
]
dev = [
    "flake8",
    "coverage",
    "mypy",
]
# --- extras for the pmcc/ research module (this fork) ---
pmcc = [
    "matplotlib",
    "tabulate",
]
pmcc-fetch = [
    "yfinance",   # extend the bundled dataset on your own machine
]
pmcc-live = [
    "ib_insync",  # Interactive Brokers adapter skeleton
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backtesting*", "pmcc*"]

[tool.setuptools.package-data]
pmcc = ["data/*.csv.gz"]
# generated research outputs are kept out of distributions via MANIFEST.in
# ("prune pmcc/results")

[tool.setuptools_scm]
version_file = "backtesting/_version.py"

[tool.ruff]
exclude = [
    '.git',
    '.eggs',
    '__pycache__',
    'doc/examples',
]
ignore = [
    'UP006',
    'UP007',
    'UP009',
    'N802',
    'N806',
    'C901',
    'B008',
    'B011',
    'RUF002',
]
line-length = 100
select = [
    'I',
    'E',
    'F',
    'W',
    'UP',
    'N',
    'C',
    'B',
    'T',
    'RUF',
    'YTT',
]

[tool.ruff.pep8-naming]
ignore-names = [
    'l',
    'h',
]
