[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "backtesting"
description = "Backtest trading strategies in Python — fork with four strategy research examples"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dynamic = ["version"]
authors = [{ name = "Zach Lûster" }]
keywords = [
    "algo", "algorithmic", "backtest", "backtesting", "bitcoin", "bokeh",
    "cointegration", "commodities", "covered-call", "crypto", "currency",
    "equity", "etf", "finance", "financial", "forex", "futures", "fx", "gold",
    "hedge", "index-effect", "index-inclusion", "invest", "investing",
    "investment", "leaps", "market", "mean-reversion", "momentum", "ohlc",
    "ohlcv", "options", "pairs-trading", "pmcc", "quant", "quantitative",
    "spread", "statistical-arbitrage", "stocks", "strategy", "trading",
    "trend-following",
]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # Core backtesting library
    "numpy >= 1.17.0",
    "pandas >= 2.0",
    "bokeh >= 3.0.0, != 3.2.*",
    # Strategy research labs (pairs_trading, pmcc, examples)
    "scipy >= 1.10",
    "statsmodels >= 0.14",
    "matplotlib >= 3.7",
    "tabulate >= 0.9",
]

[project.urls]
Documentation = "https://kernc.github.io/backtesting.py/doc/backtesting/"
Source = "https://github.com/iyedexe/pl.backtesting.py/"
Upstream = "https://github.com/kernc/backtesting.py/"

[project.scripts]
pairs = "pairs_trading.cli:main"
pmcc = "pmcc.run_backtest:cli"

[project.optional-dependencies]
doc = [
    "pdoc3",
    "jupytext >= 1.3",
    "nbconvert",
    "ipykernel",       # for nbconvert
    "jupyter_client",  # for nbconvert
]
test = [
    "matplotlib",
    "scikit-learn",
    "sambo",
    "tqdm",
    "ipywidgets",  # for tqdm
]
pmcc-fetch = [
    "yfinance",   # extend the bundled PMCC dataset on your own machine
]
pmcc-live = [
    "ib_insync",  # Interactive Brokers adapter skeleton
]

[dependency-groups]
dev = [
    "ruff >= 0.6",
    "flake8",
    "coverage",
    "mypy",
    "pytest >= 8",
    "inclusion-bot",   # the index-inclusion Telegram bot (workspace member)
]

[tool.uv.workspace]
members = ["bot"]

[tool.uv.sources]
inclusion-bot = { workspace = true }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "examples"]
include = ["backtesting*", "pairs_trading*", "pmcc*", "index_inclusion*"]

[tool.setuptools.package-data]
backtesting = ["*.js", "test/*.csv"]
pairs_trading = ["py.typed"]
pmcc = ["data/*.csv.gz"]
# generated pmcc research outputs are kept out of distributions via MANIFEST.in
# (all four packages live under examples/, see [tool.setuptools.packages.find])

[tool.setuptools_scm]
version_file = "backtesting/_version.py"
fallback_version = "0.6.5.post1"

[tool.pytest.ini_options]
testpaths = ["tests", "examples/pmcc/test_pmcc.py", "bot/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
exclude = [
    '.git',
    '.eggs',
    '.venv',
    '__pycache__',
    'doc/examples',
]

[tool.ruff.lint]
ignore = [
    'UP006',
    'UP007',
    'UP009',
    'N802',
    'N806',
    'C901',
    'B008',
    'B011',
    'RUF002',
]
select = [
    'I',
    'E',
    'F',
    'W',
    'UP',
    'N',
    'C',
    'B',
    'T',
    'RUF',
    'YTT',
]

[tool.ruff.lint.isort]
known-first-party = ["backtesting", "pairs_trading", "pmcc", "index_inclusion", "inclusion_bot"]

[tool.ruff.lint.per-file-ignores]
# CLIs, scripts and examples intentionally print to the console;
# report/figure text intentionally uses Greek letters (α, β, σ, δ).
'examples/pairs_trading/cli.py' = ['T201']
'examples/scripts/*' = ['T201']
'examples/*.py' = ['T201', 'RUF001']
'examples/pairs_trading/report.py' = ['RUF001']
'examples/pairs_trading/experiments.py' = ['RUF001', 'T201']
'examples/pairs_trading/plotting.py' = ['RUF001']

[tool.ruff.lint.pep8-naming]
ignore-names = [
    'l',
    'h',
]
