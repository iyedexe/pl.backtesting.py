name: CI
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule: [ cron: '2 2 * * 6' ]  # Every Saturday, 02:02

env:
  TQDM_MININTERVAL: 10
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run flake8 backtesting pairs_trading scripts tests
      # Upstream backtesting/ predates the ruff config; hold new code to it
      - run: uv run ruff check pairs_trading scripts tests
      - run: uv run mypy --no-warn-unused-ignores backtesting

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra test
      - env: { BOKEH_BROWSER: none }
        run: time uv run coverage run -m backtesting.test
      - run: uv run coverage combine && uv run coverage report

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra test
      - env: { BOKEH_BROWSER: none }
        run: time uv run python -m backtesting.test

  research:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run pytest tests
      # Smoke-run one small end-to-end experiment on the vendored data
      - run: uv run pairs run --study commodities --quick

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/* || true
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra doc --extra test
      - run: time uv run doc/build.sh

  win64:
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra test
      - env: { BOKEH_BROWSER: none }
        run: uv run python -m backtesting.test
