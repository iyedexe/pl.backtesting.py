name: CI
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule: [ cron: '2 2 * * 6' ]  # Every Saturday, 02:02

env:
  TQDM_MININTERVAL: 10
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --python 3.13
      - run: uv run flake8 backtesting examples tests
      # Upstream backtesting/ predates the ruff config; hold new code to it
      - run: uv run ruff check examples/pairs_trading examples/index_inclusion examples/scripts examples/*.py tests
      - run: uv run mypy --no-warn-unused-ignores backtesting

  library:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        experimental: [false]
        include:
          - python-version: '3'  # whatever the latest stable is
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --extra test --python ${{ matrix.python-version }}
      - env: { BOKEH_BROWSER: none }
        run: time uv run python -m backtesting.test

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --extra test --python 3.13
      - env: { BOKEH_BROWSER: none }
        run: time uv run coverage run -m backtesting.test
      - run: uv run coverage combine && uv run coverage report

  strategies:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --extra test --python 3.13
      # pairs_trading, index-inclusion, momentum unit tests; PMCC unit tests; bot tests
      - run: uv run pytest
      - run: uv run inclusion-bot selftest
      # Smoke-run one small end-to-end experiment per strategy
      - run: uv run pairs run --study commodities --quick
      - run: uv run python examples/pairs_trading_strategy.py --quick
      - run: uv run python examples/index_inclusion_strategy.py --quick
      - run: uv run python examples/pmcc_strategy.py --quick
      - run: TQDM_DISABLE=1 uv run python examples/momentum_strategy.py --quick

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/* || true
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --extra doc --extra test --python 3.13
      - run: time uv run doc/build.sh

  win64:
    needs:
      - library
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --extra test --python 3.13
      - env: { BOKEH_BROWSER: none }
        run: uv run python -m backtesting.test
