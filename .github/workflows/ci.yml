name: CI
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule: [ cron: '2 2 * * 6' ]  # Every Saturday, 02:02

env:
  TQDM_MININTERVAL: 10
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv lock --check
      - run: uvx flake8 backtesting bot
      - run: uvx mypy --no-warn-unused-ignores backtesting

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python 3.10 --extra test --extra dev
      # Test against pre-release versions of the heavy dependencies
      # (out-of-lock on purpose, hence --no-sync below)
      - run: uv pip install --prerelease allow -U bokeh pandas numpy
      - env: { BOKEH_BROWSER: none }
        run: time uv run --no-sync coverage run -m backtesting.test
      - run: uv run --no-sync coverage combine && uv run --no-sync coverage report

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
        experimental: [false]
        include:
          - python-version: '3'  # whatever the latest stable is
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python ${{ matrix.python-version }} --extra test
      - env: { BOKEH_BROWSER: none }
        run: time uv run python -m backtesting.test

  bot:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --package inclusion-bot
      - run: uv run --package inclusion-bot python -m unittest discover -s bot/tests -v
      - run: uv run --package inclusion-bot inclusion-bot selftest

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python 3.12 --extra doc --extra test  # installs project editable, provides ./backtesting/_version.py for pdoc
      - run: time uv run doc/build.sh

  win64:
    needs:
      - build
      - docs
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python 3.13 --extra test
      - env: { BOKEH_BROWSER: none }
        run: uv run python -m backtesting.test
