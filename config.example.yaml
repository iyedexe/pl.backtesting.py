# newsbot configuration — copy to config.yaml and edit.
# Run:  python -m newsbot run --config config.yaml
# Check what every source returns first:  python -m newsbot sources --config config.yaml
# Every key is optional; defaults are in newsbot/config.py (DEFAULT_CONFIG).

# --- Universe -------------------------------------------------------------------------------
# Whole markets: the bot listens to everything and discovers tickers from the news itself
# (provider ticker tags, "(NASDAQ: XYZ)" / "(Euronext Paris: AIR)" / "(LSE: BP)" press-release tags,
# $CASHTAGs). Markets: us, eu, uk, ca, all. Tickers use Yahoo-style suffixes (AIR.PA, BMW.DE, BP.L).
universe:
  markets: [us]                       # e.g. [eu, uk] for Europe, [us, eu] for both
  exclude: []                         # tickers never to trade
# Or an explicit list instead:
# universe: [AAPL, MSFT, NVDA, AMZN, GOOG, META, TSLA, AMD, PFE, MRNA]

# Company names per ticker (optional). Adds ticker attribution for sources that never print tickers
# (FDA, general news, ClinicalTrials.gov sponsors).
aliases:
  PFE: [Pfizer]
  MRNA: [Moderna]

# Provider keys. Leave empty to read FINNHUB_API_KEY, ALPHAVANTAGE_API_KEY, POLYGON_API_KEY,
# MARKETAUX_API_KEY, NEWSAPI_API_KEY, FMP_API_KEY from the environment. Alpaca uses
# APCA_API_KEY_ID / APCA_API_SECRET_KEY. Sources whose key is missing are disabled with a warning.
api_keys: {}

# --- Evidence sources ---------------------------------------------------------------------
# Every source drops items into a per-ticker evidence store. Kinds:
#   news / filing / regulatory / earnings_result  -> TRIGGERS: a fresh one re-scores the ticker
#   sentiment / social / earnings_upcoming        -> CONTEXT: folded into the next scoring pass
# `min_interval_seconds` overrides the built-in free-tier pacing of a source.
# In market mode every source runs market-wide: Alpaca/Polygon/FMP return all news, Finnhub uses
# its general feed (ticker-tagged via `related`), Alpha Vantage uses `topics`, Marketaux filters by
# the universe's countries, StockTwits samples trending symbols, Reddit groups new posts by $CASHTAG.
# Per-ticker feeds (yahoo, google, nasdaq_rss) automatically follow the tickers currently carrying
# evidence. Add `tickers: [...]` to any source to pin it.
sources:
  # Press-release wires: the primary source for earnings and corporate actions, no key needed.
  # Names: globenewswire_earnings, globenewswire_public, globenewswire_europe, prnewswire_earnings,
  # prnewswire_all, businesswire_earnings, accesswire, eqs_adhoc (DE ad-hoc), lse_rns (UK), sec_8k.
  # Feed URLs move occasionally: check with `python -m newsbot sources` and override with `url:`.
  - type: wire
    feed: globenewswire_earnings
  - type: wire
    feed: prnewswire_earnings
  - type: wire
    feed: sec_8k
  # - {type: wire, feed: globenewswire_europe}   # for markets: [eu, uk]
  # - {type: wire, feed: eqs_adhoc}
  # - {type: wire, feed: lse_rns}
  # Real-time, ticker-tagged, free with a paper account. Also the backfill source for backtests.
  - type: alpaca
  # Market news (60 calls/min free) and the earnings calendar with reported EPS vs consensus.
  - type: finnhub
  - type: finnhub_earnings
  # Provider sentiment. Free tier ~25 requests/day -> one sweep per hour by default.
  - type: alphavantage
    min_interval_seconds: 3600
    # topics: earnings,mergers_and_acquisitions   # market-mode default
  # Benzinga-sourced, delayed on the free tier (5 calls/min). One call per poll.
  - type: polygon
  # Small free tiers; one call per interval.
  - type: marketaux
    # countries: [fr, de, gb]            # defaults to the universe's markets
  - type: newsapi
  - type: fmp
  - type: fmp_earnings
  # Per-ticker RSS (no key); in market mode they follow the active tickers (max 50).
  - type: yahoo
  - type: google
  - type: nasdaq_rss
  # Upcoming report dates (context) from Nasdaq's public calendar.
  - type: nasdaq_earnings
  # Biotech catalysts. Tickers come from exchange tags / `aliases`.
  - type: fda                             # FDA press announcements RSS
  - type: openfda                         # Drugs@FDA approvals (needs `aliases`)
  # - type: clinicaltrials                # status changes for sponsors in `aliases` or `sponsors: {PFE: [Pfizer]}`
  # Social (context only, weak weight).
  - type: stocktwits                      # trending symbols in market mode
  - type: reddit
    subreddits: [wallstreetbets, stocks]
  # - type: rss                           # any other RSS/Atom feed
  #   url: https://example.com/feed.xml
  #   kind: filing
  # - type: file                          # JSON/CSV file (replay / testing)
  #   path: newsbot/data/sample_news.json

# --- Scoring ------------------------------------------------------------------------------
# Per-headline rule scoring feeds the bundle features and the backtest strategy.
classifier:
  type: rules

# Bundle scorer: sees ALL evidence for a ticker inside `window_hours` and returns one score.
scoring:
  type: claude                        # claude | rules   (claude needs `pip install anthropic` + ANTHROPIC_API_KEY;
                                      #                   any API failure falls back to the rule ensemble)
  model: claude-opus-5
  effort: medium                      # low | medium | high
  window_hours: 24                    # evidence look-back per ticker
  max_event_age_hours: 12             # freshness limit for reported earnings / regulatory triggers
  prefilter_min_score: 0.2            # AI scorer only sees bundles whose rule features reach this
                                      # (reported earnings / regulatory evidence always pass)
  max_passes_per_tick: 25             # cap on AI scoring passes per tick (strongest first)

signals:
  min_score: 0.5                      # bundle score needed to go long (0..1)
  target_pct: 0.05                    # take-profit distance from fill (5%)
  stop_pct: 0.03                      # stop-loss distance from fill (3%)
  max_hold_days: 7                    # hard time exit, calendar days after entry (one week)
  signal_ttl_hours: 18                # unfilled signal validity (after-close news -> next open)
  scale_target_by_score: true         # stronger catalyst -> wider target (x1.0 @ 0.5 ... x1.25 @ 1.0)
  categories: []                      # optional allow-list, e.g. [earnings_beat, guidance_raise, fda_approval]
  blocked_categories: []              # optional deny-list, e.g. [partnership]

# --- Actions: what a signal does. Any combination. ------------------------------------------
# No `trade` entry = notify-only mode: score, send the report (entry / target / stop / exit date /
# size / reasons / evidence), never place orders. Add `trade` to let the bot execute as well.
actions:
  - type: slack                       # SLACK_WEBHOOK_URL from env, or webhook_url: here
    events: [signal]                  # signal | entry | exit
    include_evidence: true
  # - type: discord                   # DISCORD_WEBHOOK_URL
  # - type: telegram                  # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  #   events: [signal, entry, exit]
  # - type: webhook                   # full JSON report to any URL
  #   url: https://example.com/hook
  # - type: trade                     # queue the signal; the bot places the order (paper or Alpaca)

prices:
  type: yfinance                      # yfinance | alpaca | static | csv
  # feed: iex                         # alpaca only

broker:
  type: paper                         # paper | alpaca
  cash: 100000                        # paper starting cash
  commission: 0.0                     # paper: per-order fixed cost
  slippage_bps: 5                     # paper: fill slippage in basis points
  paper: true                         # alpaca: use paper-api.alpaca.markets (set false for real money)

bot:
  max_positions: 5
  position_size_pct: 0.2              # notional per position as a fraction of equity
  risk_per_trade_pct: 0.01            # optional: cap size so a stop-out loses <= 1% of equity
  max_position_value: null            # optional absolute cap in dollars
  fractional_shares: false
  max_news_age_minutes: 30            # a headline older than this when first seen is context, not a trigger
  max_chase_pct: 0.05                 # skip entry if price already ran > 5% above the signal-time price
  market_hours_only: true             # trade only during each ticker's market session; signals wait for the open
  poll_interval_seconds: 60
  state_file: newsbot_state.json      # positions, pending signals, evidence, decisions, trade log
