[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "inclusion-bot"
version = "0.1.0"
description = "Telegram signal bot for the index-inclusion strategy"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "pandas >= 2.0",
    "numpy >= 1.24",
    "requests >= 2.31",
    "yfinance >= 0.2.40",
    "lxml >= 4.9",     # pandas.read_html backend for the Wikipedia tables
]

[project.scripts]
inclusion-bot = "inclusion_bot.__main__:main"

[tool.setuptools]
packages = ["inclusion_bot"]
